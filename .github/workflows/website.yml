name: website

on:
  push:
    branches:
      - main

jobs:
  deploy:
    environment:
      name: Website
      url: ${{steps.deployment.outputs.page_url}}
    permissions:
      contents: read
      id-token: write
      pages: write
      actions: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx puppeteer browsers install chrome
      - run: npm run docs
      - name: Clean old github-pages artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/actions/artifacts --paginate \
            -q '.artifacts[] | select(.name=="github-pages") | .id' \
          | while read id; do
              echo "Deleting old artifact $id"
              gh api -X DELETE repos/${{ github.repository }}/actions/artifacts/$id || true
            done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - uses: actions/deploy-pages@v5
        id: deployment
